name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, eg 1.2.0 (tagged v1.2.0)"
        required: true
      draft:
        description: "Make a draft release (only visible to you) to check it first"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          re='^([0-9]+)\.([0-9]+)(\.([0-9]+))?(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$v" =~ $re ]]; then
            echo "::error::\"$v\" isn't a version like 1.2.0 (or 1.2.0-beta.1). Tag releases as v1.2.0."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=${BASH_REMATCH[2]}; patch=${BASH_REMATCH[4]:-0}
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch versions go up to 99, so the version code stays in step."
            exit 1
          fi
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          prerelease=false; [[ "$v" == *-* ]] && prerelease=true
          {
            echo "name=$v"
            echo "code=$code"
            echo "tag=v$v"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version $v, version code $code"

      - name: Secrets check
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE" ] || missing+=(SIGNING_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(SIGNING_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(SIGNING_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(SIGNING_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See \"Releases\" in the README."
            exit 1
          fi

      - name: Put the keystore in place
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # -i ignores line breaks, in case the base64 was pasted wrapped.
          printf '%s' "$KEYSTORE" | base64 --decode -i > "$RUNNER_TEMP/release.jks"
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "::error::SIGNING_KEYSTORE_BASE64 didn't decode to a file."; exit 1; }

#      - name: Run tests
#        run: |
#          chmod +x gradlew
#          ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          LEDGEDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          LEDGEDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          LEDGEDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          LEDGEDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          LEDGEDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          LEDGEDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check signed
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::No APK at $apk"; ls -R app/build/outputs/apk || true; exit 1; }
          # The newest build tools on the runner, for apksigner.
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q "CN=Android Debug" <<< "$certs"; then
            echo "::error::The APK is signed with the debug key, not yours."
            exit 1
          fi
          out="ledgedroid-$VERSION.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Del keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          FILE: ${{ steps.apk.outputs.file }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Run again for the same version: replace the files.
            gh release upload "$TAG" "$FILE" "$FILE.sha256" --clobber
          else
            flags=(--title "Ledgedroid $VERSION" --generate-notes --target "$GITHUB_SHA")
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            [ "$DRAFT" = "true" ] && flags+=(--draft)
            gh release create "$TAG" "$FILE" "$FILE.sha256" "${flags[@]}"
          fi
          {
            echo "### Ledgedroid $VERSION"
            echo ""
            echo "\`$FILE\` — SHA-256 \`$(cut -d' ' -f1 "$FILE.sha256")\`"
            [ "$DRAFT" = "true" ] && echo "" && echo "Made as a draft: publish it from the Releases page."
          } >> "$GITHUB_STEP_SUMMARY"
